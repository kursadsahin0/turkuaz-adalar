name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: End-to-end smoke test
        # The real game in the runner's preinstalled Google Chrome (software
        # WebGL): dev build flows, then the release build in dist/ boots.
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7

  android:
    name: Android release build
    runs-on: ubuntu-latest
    needs: web
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      - name: Build web and sync Capacitor
        # Optional secrets: without them the bundle uses Google's test ads.
        env:
          VITE_ADMOB_REWARDED_ANDROID: ${{ secrets.ADMOB_REWARDED_ANDROID }}
          VITE_ADMOB_BANNER_ANDROID: ${{ secrets.ADMOB_BANNER_ANDROID }}
          VITE_ADMOB_INTERSTITIAL_ANDROID: ${{ secrets.ADMOB_INTERSTITIAL_ANDROID }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: npm run android:sync

      - name: Restore upload key
        # Optional: add these repository secrets to get a signed, uploadable
        # bundle. Without them the build is unsigned but still proves R8,
        # resources and versioning are healthy.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/upload.jks

      - name: Gradle bundleRelease
        working-directory: android
        env:
          TURKUAZ_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'upload.jks' || '' }}
          TURKUAZ_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TURKUAZ_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TURKUAZ_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Required once the keystore secrets are set: a signed release with
          # Google's test app ID is refused by app/build.gradle.
          ADMOB_APP_ID_ANDROID: ${{ secrets.ADMOB_APP_ID_ANDROID }}
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 7
